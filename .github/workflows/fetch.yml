name: Actualizar resultados

on:
  schedule:
    - cron: '*/10 * * * 5,6,0'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr scraper
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          # Notificación al celular (configurá al menos uno en Settings → Secrets):
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Súper Rugby / Seis Naciones apagados por defecto. Poné "1" para activarlos.
          ENABLE_SECONDARY: ""
        run: python fetch_results.py

      # El scraper ya sube los JSON directo via GitHub API — no se necesita git push adicional
